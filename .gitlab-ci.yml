# Publishes TestKit to GitLab Pages: /v1/testkit.js (+ core and player) and /demo/.
image: node:24-alpine

pages:
  stage: deploy
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run build
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
